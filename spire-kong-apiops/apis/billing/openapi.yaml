openapi: 3.0.3
info:
  title: Billing API (disabled example)
  version: 1.0.0
paths:
  /finance/billing/v1:
    get:
      summary: Read billing
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Billing response
        '401':
          description: Authentication rejected
        '403':
          description: Permission rejected
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

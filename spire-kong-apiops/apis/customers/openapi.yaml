# API contract. Keep paths/methods aligned with kong.yaml.
openapi: 3.0.3
info:
  title: Customers
  version: 1.0.0
paths:
  /crm/customers/v1:
    get:
      summary: Read customers
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Successful response
        '401':
          description: Authentication rejected
        '403':
          description: Permission rejected
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

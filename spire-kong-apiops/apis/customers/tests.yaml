# Replace the success body assertion with a real stable response property.
tests:
- name: authenticated-read
  method: GET
  path: /crm/customers/v1
  auth: valid
  expected_status: 200
  body_contains: customers
- name: missing-token-rejected
  method: GET
  path: /crm/customers/v1
  auth: none
  expected_status: 401
  body_contains: ''
- name: invalid-token-rejected
  method: GET
  path: /crm/customers/v1
  auth: invalid
  expected_status: 401
  body_contains: ''
